
<!DOCTYPE html>
<html>
<head>
    <title>Complaint Management</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Complaint Management System</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="student.html">Student Dashboard</a>
    <a href="login.html">Admin Login</a>
</nav>


    <h2>Welcome to Campus Help Desk</h2>

    <h3>Submit Your Complaint</h3>

    <form>
        <label>Student Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Complaint Title:</label><br>
        <input type="text" placeholder="Enter complaint title"><br><br>

        <label>Category:</label><br>
        <select>
            <option>Hostel</option>
            <option>College</option>
            <option>Transport</option>
            <option>Other</option>
        </select><br><br>

        <label>Description:</label><br>
        <textarea placeholder="Describe your complaint"></textarea><br><br>

        <button type="submit">Submit Complaint</button>
    </form>
<div id="complaints"></div>

<script src="script.js"></script>
</body>
</html>
